<div class="cart-item p-3 bg-white flex md:flex-row gap-2 md:gap-0 flex-col border-1 border-gray-300">
    <div class="flex flex-1" >
        <div class="image w-24 h-24 aspect-square mr-3 cursor-pointer" [routerLink]="['/product', itemId]">
            <img [src]="itemImage" class="object-cover" alt="">
        </div>
        <div class="info flex-1 flex items-center">
            <p class="product-name text-2xl cursor-pointer text-gray-600" [routerLink]="['/product', itemId]">
                {{itemName | maxStrLen:120}}
            </p>
        </div>
    </div>
    <div class="amount flex items-center gap-2">
        <select-amount
        [negativeValue]="false"
        [initialValue]="itemAmount"
        (outputAmount)="amount($event)"
        ></select-amount>
        <p class="total text-xl text-center w-40">
            {{ totalPrice/100 }}
        </p>
        <span class="delete" (click)="delete()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 cursor-pointer text-red-500 transition-transform hover:scale-105 active:scale-95">
                <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
            </svg>
        </span>
    </div>
</div>
