<section class="bg-gradient-to-b from-emerald-500 to-emerald-400 sticky top-0 block mb-3 z-50">
    <div class="center-content">
        <ul class="text-white font-light text-sm pt-1 list-none flex flex-row gap-2">
            <li class="cursor-pointer text-shadow-md"></li>
            <li class="cursor-pointer text-shadow-md">Criar minha loja</li>
        </ul>
    </div>
    <div class="center-content py-2 flex">
        <div class="c-left ms-2">
            <span class="items-center justify-center flex cursor-pointer" [routerLink]="['/']">
                <h1 class="text-4xl text-white hidden sm:block">Verdi</h1>
                <img src="./images/verdiq-logo.png" alt="" class="h-10">
            </span>
        </div>
        <search class="c-center self-center ms-2 sm:ms-5 me-5 flex-1 basis-0 flex items-center  p-0.5 h-9 bg-white" >
            <input type="text" class="w-full outline-0 text-black px-2 font-light" placeholder="Search">
            <button class="h-4/5 px-1 sm:flex justify-center items-center border-s-1 border-s-emerald-400 hidden">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" stroke="#afa" class="size-5">
                    <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11ZM2 9a7 7 0 1 1 12.452 4.391l3.328 3.329a.75.75 0 1 1-1.06 1.06l-3.329-3.328A7 7 0 0 1 2 9Z" clip-rule="evenodd" />
                </svg>
            </button>
        </search>
        <div class="c-right me-2 flex items-center justify-center gap-5">
            <span class="flex flex-col items-center text-white">
                <span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#fff" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
                    </svg>                      
                </span>
                <span class="hidden sm:inline">Carrinho</span>
            </span>
            <span class="flex flex-col items-center text-white">
                <span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                    </svg>                                            
                </span>
                <span class="hidden sm:inline">Conta</span>
            </span>
        </div>
    </div>
</section>
