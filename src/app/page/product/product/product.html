<select-cart-modal (selectedCart)="insertProductToCart($event)"></select-cart-modal>
<standart-page>

    <div class="product flex flex-col md:flex-row p-2 pt-0 gap-2 mb-3">
        <div class="carousel-wrapper flex-none md:flex-3 basis-0">
            <product-image-carousel
            ></product-image-carousel>
        </div>
        <div class="product-info flex-none md:flex-4 basis-0">
            <div class="mb-3">
                <h1 class="product-name text-2xl font-medium text-gray-600">
                    {{ product.name }}
                </h1>
                <h5 class="store-name text-sm">
                    Vendido por: <span class="text-blue-400 cursor-pointer hover:text-blue-700 transition-colors" [routerLink]="['/store',product.store.id]">{{ product.store.name }}</span>
                </h5>
            </div>
            <div class="mb-3">
                <h1 class="price text-3xl">
                    R$ {{ product.price/100 }}
                </h1>
            </div>
            <div class="">
                <div class="flex flex-row items-center gap-2 mb-3 ">
                    <p class="text-gray-600 text-sm">Quantidade</p>
                    <select-amount
                    [maxValue]="product.stock.amount"
                    [initialValue]="1"
                    (outputAmount)="changeProductBufferAmount($event)"
                    ></select-amount>
                </div>
                <div class="buttons flex flex-row gap-4">
                    <button (click)="toggleSelectCartModal()" class="w-47 h-12 text-emerald-700 border border-emerald-700 bg-emerald-50 hover:bg-emerald-100 transition-colors cursor-pointer">
                        Adicionar ao Carrinho
                    </button>
                    <button class="w-47 h-12 text-emerald-50 bg-emerald-700 border border-emerald-700 hover:bg-emerald-900 transition-colors cursor-pointer">
                        Comprar agora
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="description px-2 md:px-0">
        <dropdown title="DESCRIÇÃO DO PRODUTO">
            <p class="text-justify">
                {{ product.description }}
            </p>
        </dropdown>
    </div>
    <div class="recommendations p-2 md:p-0">
        <div class="bg-gradient-to-r from-emerald-800 to-emerald-300 w-full h-px my-3"></div>
        <h1 class="text-sm font-medium text-gray-600 mb-2">VOCÊ TAMBÉM PODE GOSTAR</h1>
        <div class="product-grid product-grid grid gap-2 pb-2">
            @if (recomendations) {
                @for (recomendation of recomendations; track $index) {
                    <product-card
                    [id]="recomendation.id"
                    [name]="recomendation.name"
                    [price]="recomendation.price"
                    ></product-card>
                }
            }
        </div>
    </div>

</standart-page>
