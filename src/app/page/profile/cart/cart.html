<div class="cart-grid grid gap-2">
    <div class="create-cart border-2 border-gray-400 text-gray-400 bg-gray-50 hover:bg-gray-300 cursor-pointer transition-colors rounded-lg flex justify-center items-center">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
    </div>
    @for(userCart of cartService.getUserCarts(); track $index) {
        <cart-icon
        [id]="userCart.id"
        [name]="userCart.name"
        ></cart-icon>
    }
</div>
